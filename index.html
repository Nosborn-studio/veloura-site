<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0" />

  <title>Veloura Dining | Luxury Fine Dining Experience</title>

  <!-- SEO -->
  <meta
    name="description"
    content="Veloura Dining Experience — fine dining cinematográfico, cocina de autor y experiencia luxury." />

  <!-- GOOGLE FONTS -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <!-- REMIX ICONS -->
  <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css"
    rel="stylesheet">

  <!-- TAILWIND -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- GSAP -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

  <!-- LENIS -->
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/bundled/lenis.min.js"></script>

  <!-- STYLES -->
  <link
    rel="stylesheet"
    href="./css/style.css">

</head>

<body class="bg-black text-white overflow-x-hidden">

  <!-- PARTICLES -->
  <canvas id="particles-canvas"></canvas>

  <!-- NOISE -->
  <div class="noise"></div>

  <!-- CURSOR GLOW -->
  <div id="cursor-glow"></div>

  <!-- LIGHT LEAKS -->
  <div class="light-leak light-leak-1"></div>
  <div class="light-leak light-leak-2"></div>

  <!-- LOADER -->
  <div data-component="loader"></div>

  <!-- NAVBAR -->
  <div data-component="navbar"></div>

  <main class="relative z-10 overflow-hidden">

    <!-- HERO -->
    <div data-component="hero"></div>

    <!-- MARQUEE -->
    <div data-component="marquee"></div>

    <!-- CINEMATIC TRANSITION -->
    <div data-component="cinematic-transition"></div>

    <!-- MENU -->
    <div data-component="menu"></div>

    <!-- TASTING MENU -->
    <div data-component="tasting-menu"></div>

    <!-- WINE PAIRING -->
    <div data-component="wine-pairing"></div>

    <!-- CINEMATIC GALLERY -->
    <div data-component="cinematic-gallery"></div>

    <!-- EXPERIENCE -->
    <div data-component="experience"></div>

    <!-- SIGNATURE -->
    <div data-component="signature"></div>

    <!-- CHEF -->
    <div data-component="chef"></div>

    <!-- AWARDS -->
    <div data-component="awards"></div>

    <!-- GALLERY -->
    <div data-component="gallery"></div>

    <!-- EDITORIAL -->
    <div data-component="editorial"></div>

    <!-- SOCIAL PROOF -->
    <div data-component="social-proof"></div>

    <!-- TESTIMONIALS -->
    <div data-component="testimonials"></div>

    <!-- RESERVATION FLOW -->
    <div data-component="reservation-flow"></div>

    <!-- PRIVATE EVENTS -->
    <div data-component="private-events"></div>

    <!-- RESERVATIONS -->
    <div data-component="reservations"></div>

    <!-- LOCATION -->
    <div data-component="location"></div>

    <!-- FAQ -->
    <div data-component="faq"></div>

    <!-- FINAL CINEMATIC CTA -->
    <div data-component="final-cinematic-cta"></div>

    <!-- FOOTER -->
    <div data-component="footer"></div>

  </main>

  <!-- MAIN JS -->
  <script src="./js/main.js"></script>

</body>

</html>
